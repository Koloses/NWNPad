; NWNPad - Xbox / XInput gamepad mod for Neverwinter Nights: Enhanced Edition
; Place this file next to nwmain.exe (bin\win32) together with version.dll.

[General]
; 0 disables the mod completely (the game runs untouched)
Enabled=1

[Interface]
; gamepad HUD (hero frame, party, target frame, action wheel, message feed).
; 0 = keep the game's own HUD (quickbar, party bar, chat ...)
GamepadHUD=1
; gamepad conversation window (0 = the game's dialogue panel with the cursor)
GamepadDialogue=1
; gamepad hub (Start), loot window and merchant window (0 = the game's panels with the cursor)
GamepadMenus=1
; UI scale multiplier, 0 = automatic (1.0 at 1080p)
Scale=0
; text code page of the game language, 0 = automatic (cp1250 for Polish/Czech, cp1251 Russian, cp1252 western)
CodePage=0
; hide the mouse pointer while playing with the pad
HideMouseCursor=1

[Controls]
; stick dead zones (0..1)
DeadzoneLeft=0.24
DeadzoneRight=0.20
; left stick deflection below this walks, above runs
WalkThreshold=0.55
; vibrate when the hero takes damage
Rumble=1

[Camera]
; right stick speed relative to the game's camera keys (1.0 = same as the keyboard)
TurnSpeed=1.0
TiltSpeed=0.8
ZoomSpeed=0.8
InvertX=0
InvertY=0

[Targeting]
; soft-target search radius for creatures (metres)
Range=12
; radius for doors, placeables and items
InteractRange=5

[Developer]
; virtual pad input file for automated testing; leave empty
InjectFile=
DumpArea=0
